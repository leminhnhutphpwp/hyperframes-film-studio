<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Battle</title>
    <!-- Generated by tools/battle.py build: asset catalog + this battle's config -->
    <link rel="stylesheet" href="fonts/lora.css" />
    <script src="assets/lib/library.js"></script>
    <script src="battle.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #three-layer {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
      /* map annotations (labels, advance arrows, title) drawn over the 3D scene */
      #annot {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: visible;
      }
      .side-label {
        position: absolute;
        left: 0;
        top: 0;
        padding: 12px 22px 12px 18px;
        border-left: 8px solid var(--c);
        border-radius: 6px;
        background: rgba(24, 18, 10, 0.78);
        color: #f6efe0;
        font-family: "Lora", serif;
        font-weight: 700;
        font-size: 34px;
        line-height: 1.25;
        white-space: nowrap;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        opacity: 0;
      }
      .side-label small {
        display: block;
        font-size: 22px;
        font-weight: 600;
        color: #d8cdb6;
      }
      #title {
        position: absolute;
        left: 64px;
        top: 52px;
        max-width: 1100px;
        padding: 14px 26px;
        border-radius: 6px;
        background: rgba(24, 18, 10, 0.72);
        color: #f6efe0;
        font-family: "Lora", serif;
        font-weight: 700;
        font-size: 40px;
        line-height: 1.25;
        opacity: 0;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 60%, rgba(25, 15, 0, 0.4) 100%);
      }
    </style>
  </head>
  <body>
    <!-- data-duration must match battle.json "duration" (battle.py build keeps them in sync) -->
    <div id="root" data-composition-id="main" data-no-timeline data-start="0" data-width="1920" data-height="1080" data-duration="10">
      <canvas id="three-layer"></canvas>
      <div id="vignette"></div>
      <svg id="annot" viewBox="0 0 1920 1080"></svg>
      <div id="labels"></div>
      <div id="title"></div>
    </div>

    <script type="module">
      import * as THREE from "three";

      const CFG = window.BATTLE,
        LIB = window.LIB;
      const W = 1920,
        H = 1080,
        DUR = CFG.duration || 10;
      const LANES = CFG.lanes || 12;
      const CLASH = CFG.clash ?? 5.2;

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("three-layer"), antialias: true });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const HAZE = 0xcdb894;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(HAZE);
      scene.fog = new THREE.Fog(HAZE, 60, 160);
      const camera = new THREE.PerspectiveCamera(37, W / H, 0.1, 500);

      // ---------- helpers ----------
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const smooth = (x) => {
        x = clamp01(x);
        return x * x * (3 - 2 * x);
      };
      const easeOut = (x) => 1 - Math.pow(1 - clamp01(x), 3);
      const easeIn = (x) => Math.pow(clamp01(x), 2);
      const lerp = (a, b, u) => a + (b - a) * u;
      const seg = (t, a, b) => clamp01((t - a) / (b - a));
      function rand(n) {
        n = (n * 374761393 + 668265263) | 0;
        n = Math.imul(n ^ (n >>> 13), 1274126177);
        return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
      }
      const mixPose = (a, b, w) => {
        const o = {};
        for (const k in a) o[k] = lerp(a[k], k in b ? b[k] : a[k], w);
        return o;
      };

      // ---------- light, ground ----------
      scene.add(new THREE.HemisphereLight(0xc9d6e4, 0x5b4a30, 1.2));
      const sun = new THREE.DirectionalLight(0xffe2bd, 2.6);
      sun.position.set(-14, 30, 22);
      sun.castShadow = true;
      sun.shadow.mapSize.set(4096, 2048);
      sun.shadow.bias = -0.0003;
      Object.assign(sun.shadow.camera, { left: -34, right: 34, top: 20, bottom: -20, near: 1, far: 90 });
      scene.add(sun);

      const under = new THREE.Mesh(new THREE.PlaneGeometry(400, 300), new THREE.MeshStandardMaterial({ color: 0x5c6b34, roughness: 1 }));
      under.rotation.x = -Math.PI / 2;
      under.position.y = -0.05;
      scene.add(under);
      const terrainTex = new THREE.TextureLoader().load(LIB.terrain);
      terrainTex.colorSpace = THREE.SRGBColorSpace;
      terrainTex.anisotropy = 8;
      const terrain = new THREE.Mesh(new THREE.PlaneGeometry(84, 56), new THREE.MeshStandardMaterial({ map: terrainTex, roughness: 1 }));
      terrain.rotation.x = -Math.PI / 2;
      terrain.position.set(0, 0.01, -9);
      terrain.receiveShadow = true;
      scene.add(terrain);

      // ---------- paper cut-out parts from the library ----------
      const texLoader = new THREE.TextureLoader();
      const matCache = {},
        geoCache = {};
      function partMat(dir, name) {
        const key = dir + "/" + name;
        if (!matCache[key]) {
          const tex = texLoader.load(`${dir}/${name}.png`);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.anisotropy = 4;
          matCache[key] = new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 1 });
        }
        return matCache[key];
      }
      // A plane showing one part at scale k (m/px), translated so the pixel pivot sits at the origin.
      function card(set, name, pivot, k, z = 0) {
        const P = set.parts[name];
        const key = `${set.dir}/${name}/${pivot}/${k}`;
        if (!geoCache[key]) {
          const g = new THREE.PlaneGeometry(P.w * k, P.h * k);
          g.translate(-(pivot[0] - P.w / 2) * k, -(P.h / 2 - pivot[1]) * k, 0);
          geoCache[key] = g;
        }
        const m = new THREE.Mesh(geoCache[key], partMat(set.dir, name));
        m.position.z = z;
        m.castShadow = true;
        return m;
      }
      const kitScale = (kit) => 0.92 / (kit.parts.thigh.h * 0.88 + kit.parts.shin.h);

      // Build a puppet from a kit. headSet/headName optionally swap in a face from a heads sheet.
      const JOINT = 0.07; // pieces pivot a little inside their top ends, so bent joints overlap instead of opening a gap
      function makeFigure(kit, headSet, headName, size = 1) {
        const P = kit.parts,
          k = kitScale(kit) * size;
        const J = (n) => P[n].h * JOINT;
        const L = { upper: (P.upper.h * 0.86 - J("fore")) * k, fore: P.fore.h * 0.82 * k, thigh: (P.thigh.h * 0.88 - J("shin")) * k, shin: (P.shin.bottom[1] - J("shin")) * k, sole: (P.shin.h - P.shin.bottom[1]) * k };
        const root = new THREE.Group(),
          fall = new THREE.Group(),
          hip = new THREE.Group(),
          torso = new THREE.Group();
        root.add(fall);
        fall.add(hip);
        hip.add(torso);
        const T = P.torso;
        const hipPx = [(T.top[0] + T.bottom[0]) / 2, T.h * 0.7];
        torso.add(card(kit, "torso", hipPx, k, 0));
        const toLocal = (px) => [(px[0] - hipPx[0]) * k, (hipPx[1] - px[1]) * k];
        const head = new THREE.Group();
        const neck = toLocal(T.top);
        head.position.set(neck[0], neck[1] - 0.09 * size, 0);
        if (headSet) {
          // faces from a heads sheet are scaled so their median height matches the kit's own head
          const hs = Object.values(headSet.parts).map((p) => p.h).sort((a, b) => a - b);
          const hk = (P.head.h * k) / hs[hs.length >> 1];
          head.add(card(headSet, headName, headSet.parts[headName].bottom, hk, -0.006));
        } else head.add(card(kit, "head", P.head.bottom, k, -0.006));
        torso.add(head);
        function limb(parent, at, up, lo, upLen, loLen, z) {
          const a = new THREE.Group();
          a.position.set(at[0], at[1], z);
          a.add(card(kit, up, [P[up].top[0], J(up)], k, 0.002));
          const b = new THREE.Group();
          b.position.y = -upLen;
          b.add(card(kit, lo, [P[lo].top[0], J(lo)], k, 0));
          a.add(b);
          const end = new THREE.Group();
          end.position.y = -loLen;
          b.add(end);
          parent.add(a);
          return { a, b, end };
        }
        const sh = toLocal(T.shoulder);
        // armL = far arm (shield / bow), armR = near arm (weapon / draw hand)
        const f = {
          root,
          fall,
          hip,
          torso,
          head,
          L,
          k,
          shY: sh[1],
          armL: limb(torso, [sh[0] - 0.02, sh[1]], "upper", "fore", L.upper, L.fore, -0.06),
          armR: limb(torso, sh, "upper", "fore", L.upper, L.fore, 0.035),
          legL: limb(hip, [0.02, 0], "thigh", "shin", L.thigh, L.shin, -0.03),
          legR: limb(hip, [-0.02, 0], "thigh", "shin", L.thigh, L.shin, -0.02),
        };
        scene.add(root);
        return f;
      }

      function applyPose(f, p) {
        const L = f.L;
        const fh = (a, b) => L.thigh * Math.cos(a) + L.shin * Math.cos(a + b);
        f.hip.position.y = p.seat ? p.lift || 0 : Math.max(fh(p.lL1, p.lL2), fh(p.lR1, p.lR2)) + L.sole + (p.lift || 0);
        f.torso.rotation.z = -p.lean;
        f.head.rotation.z = -(p.tilt || 0);
        f.armL.a.rotation.z = p.aL1 + p.lean;
        f.armL.b.rotation.z = p.aL2;
        f.armR.a.rotation.z = p.aR1 + p.lean;
        f.armR.b.rotation.z = p.aR2;
        f.legL.a.rotation.z = p.lL1;
        f.legL.b.rotation.z = p.lL2;
        f.legR.a.rotation.z = p.lR1;
        f.legR.b.rotation.z = p.lR2;
        f.fall.rotation.z = p.fall || 0;
      }

      // Weapons: every library weapon is drawn vertical, tip/head up.
      function equip(f, kit) {
        const P = kit.parts,
          k = f.k;
        const g = new THREE.Group();
        if (kit.weapon === "polearm" || kit.weapon === "musket") {
          g.add(card(kit, "weapon", [P.weapon.w / 2, P.weapon.h * 0.6], (kit.weapon === "musket" ? 1.9 : 2.5) / P.weapon.h, 0.004));
          f.armR.end.add(g);
          f.pole = g; // kept world-aligned each frame
        } else if (kit.weapon === "blade") {
          g.add(card(kit, "weapon", [P.weapon.w / 2, P.weapon.h * 0.9], k * 1.15, 0.004));
          g.rotation.z = -Math.PI / 2 + 0.15; // blade forward from the fist
          f.armR.end.add(g);
        } else if (kit.weapon === "bow") {
          g.add(card(kit, "weapon", [P.weapon.w / 2, P.weapon.h * 0.5], 1.35 / P.weapon.h, -0.005));
          g.rotation.z = -Math.PI / 2; // limbs across the aiming arm
          f.armL.end.add(g);
        } else if (kit.weapon === "crossbow") {
          g.add(card(kit, "weapon", [P.weapon.w / 2, P.weapon.h * 0.7], 0.85 / P.weapon.h, 0.004));
          g.rotation.z = Math.PI; // prod points along the aiming arm
          f.armL.end.add(g);
        }
        if (kit.role === "cung-thu" || kit.weapon === "bow" || kit.weapon === "crossbow") {
          // the shield cell holds a quiver: wear it on the back
          const q = card(kit, "shield", P.shield.top, k * 0.8, -0.08);
          q.rotation.z = 0.35;
          q.position.set(-0.12, f.shY * 0.92, 0);
          f.torso.add(q);
        } else if (kit.weapon !== "musket") {
          const s = new THREE.Group();
          s.add(card(kit, "shield", [P.shield.w / 2, P.shield.h / 2], Math.min(0.98, 0.78 * Math.max(1, P.shield.h / P.shield.w)) / P.shield.h, -0.01));
          f.armL.end.add(s);
          f.shield = s;
        }
      }

      // ---------- mounts: horse / elephant puppets ----------
      // Sheet cells are each drawn to fill their cell, so every part is scaled to its own real size
      // ([dimension, metres]). Anchors are fractions of the body image (x from the rump, y from the top).
      const MOUNT = {
        horse: {
          size: { body: ["w", 1.75], head: ["h", 1.05], "front-upper": ["h", 0.8], "front-lower": ["h", 0.62], "hind-upper": ["h", 0.84], "hind-lower": ["h", 0.6], tail: ["h", 0.85], saddle: ["w", 0.95] },
          front: [0.8, 0.32], hind: [0.2, 0.3], neck: [0.9, 0.22], tail: [0.03, 0.12], seat: [0.53, 0.02],
          headPivot: [0.28, 0.86], saddleAt: 0.2, seatAt: 0.1, tailRest: -0.35,
          speed: 8.5, stride: 3.4, swing: [0.55, 1.1], gap: [1.9, 3.6], strike: 2,
        },
        elephant: {
          size: { body: ["w", 3.2], head: ["h", 2.0], "front-upper": ["h", 1.05], "front-lower": ["h", 0.85], "hind-upper": ["h", 1.05], "hind-lower": ["h", 0.85], tail: ["h", 1.0], saddle: ["w", 2.2] },
          front: [0.78, 0.5], hind: [0.2, 0.5], neck: [0.93, 0.3], tail: [0.03, 0.2], seat: [0.5, 0.04],
          headPivot: [0.14, 0.32], saddleAt: 0.36, seatAt: 0.28, tailRest: -0.15,
          speed: 3.6, stride: 2.4, swing: [0.3, 0.35], gap: [3.6, 5.4], strike: 3,
        },
      };
      const darkCache = {};
      function shade(m) {
        const key = m.material.uuid;
        if (!darkCache[key]) (darkCache[key] = m.material.clone()).color.setHex(0x8f8a80);
        m.material = darkCache[key];
        return m;
      }
      function makeMount(set) {
        const M = MOUNT[set.type],
          P = set.parts;
        const kOf = (n) => M.size[n][1] / P[n][M.size[n][0]];
        const B = P.body,
          kb = kOf("body");
        const at = (f) => [(f[0] - 0.5) * B.w * kb, (0.5 - f[1]) * B.h * kb];
        const root = new THREE.Group(),
          lift = new THREE.Group(),
          body = new THREE.Group();
        root.add(lift);
        lift.add(body);
        body.add(card(set, "body", [B.w / 2, B.h / 2], kb, 0));
        // body height from the front leg; hind legs are stretched to reach the same ground
        const UP = 0.1,
          LO = 0.08;
        const knee = (up, lo) => P[up].h * kOf(up) * (0.88 - UP) - P[lo].h * kOf(lo) * LO;
        const reach = (up, lo) => knee(up, lo) + P[lo].h * kOf(lo);
        const bodyY = reach("front-upper", "front-lower") - at(M.front)[1];
        const hindK = (bodyY + at(M.hind)[1]) / reach("hind-upper", "hind-lower");
        function leg(end, up, lo, s, z, dark) {
          const a = new THREE.Group(),
            b = new THREE.Group();
          const [x, y] = at(end);
          a.position.set(x + (dark ? -0.06 : 0), y, z);
          const cu = card(set, up, [P[up].top[0], P[up].h * UP], kOf(up) * s, 0.002),
            cl = card(set, lo, [P[lo].top[0], P[lo].h * LO], kOf(lo) * s, 0);
          a.add(dark ? shade(cu) : cu);
          b.position.y = -knee(up, lo) * s;
          b.add(dark ? shade(cl) : cl);
          a.add(b);
          body.add(a);
          return { a, b };
        }
        const legs = {
          ff: leg(M.front, "front-upper", "front-lower", 1, -0.07, true),
          hf: leg(M.hind, "hind-upper", "hind-lower", hindK, -0.07, true),
          fn: leg(M.front, "front-upper", "front-lower", 1, 0.05),
          hn: leg(M.hind, "hind-upper", "hind-lower", hindK, 0.05),
        };
        const head = new THREE.Group();
        head.position.set(...at(M.neck), 0.03);
        head.add(card(set, "head", [P.head.w * M.headPivot[0], P.head.h * M.headPivot[1]], kOf("head"), 0));
        body.add(head);
        const tail = new THREE.Group();
        tail.position.set(...at(M.tail), -0.03);
        tail.add(card(set, "tail", P.tail.top, kOf("tail"), 0));
        body.add(tail);
        const S = P.saddle,
          ks = kOf("saddle");
        const [sx, sy] = at(M.seat);
        const saddle = card(set, "saddle", [S.w / 2, S.h * M.saddleAt], ks, 0.08);
        saddle.position.set(sx, sy, 0.08);
        body.add(saddle);
        const seat = new THREE.Group();
        if (set.type === "horse") seat.position.set(sx - 0.12, sy - 0.05, 0.14); // down into the back, mid-saddle
        else seat.position.set(sx, sy + (M.saddleAt - M.seatAt) * S.h * ks, 0.14); // on the howdah floor
        body.add(seat);
        body.position.y = bodyY;
        scene.add(root);
        return { root, lift, body, head, tail, legs, seat, M, type: set.type };
      }
      // gait phase in strides; amp 0 = standing, 1 = full gallop / stride
      function poseMount(m, ph, amp, t, seed) {
        const M = m.M,
          [A, Bk] = M.swing;
        const offs = m.type === "horse" ? { hf: 0, hn: 0.1, ff: 0.38, fn: 0.48 } : { hn: 0, fn: 0.25, hf: 0.5, ff: 0.75 };
        for (const k in offs) {
          const s = 2 * Math.PI * (ph + offs[k]);
          const front = k[0] === "f";
          m.legs[k].a.rotation.z = amp * A * Math.sin(s);
          m.legs[k].b.rotation.z = (front ? -1 : 1) * amp * Bk * Math.max(0, Math.cos(s));
        }
        const c = 2 * Math.PI * ph;
        m.lift.position.y = (m.type === "horse" ? 0.1 : 0.05) * amp * Math.abs(Math.sin(c));
        m.lift.rotation.z = (m.type === "horse" ? 0.05 : 0.02) * amp * Math.sin(c);
        m.head.rotation.z = (m.type === "horse" ? -0.1 : 0.05) * amp * Math.sin(c + 1) + 0.03 * Math.sin(t * 1.4 + seed);
        m.tail.rotation.z = M.tailRest - 0.35 * amp + 0.12 * Math.sin(t * 2.6 + seed);
      }
      // accelerate, cruise, slow to a stop over distance D; at(τ) → [distance, speed]
      function travel(D, v, Ta, Td) {
        if (D < (v * (Ta + Td)) / 2) v = (2 * D) / (Ta + Td);
        const Tc = (D - (v * (Ta + Td)) / 2) / v,
          T = Ta + Tc + Td;
        const at = (τ) => {
          if (τ <= 0) return [0, 0];
          if (τ < Ta) return [(v * τ * τ) / (2 * Ta), (v * τ) / Ta];
          if (τ < Ta + Tc) return [(v * Ta) / 2 + v * (τ - Ta), v];
          if (τ < T) {
            const r = T - τ;
            return [D - (v * r * r) / (2 * Td), (v * r) / Td];
          }
          return [D, 0];
        };
        return { T, at, v };
      }

      function makeArrow() {
        const g = new THREE.Group();
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.8, 5), new THREE.MeshStandardMaterial({ color: 0x5a3a1e }));
        shaft.rotation.x = Math.PI / 2;
        const tip = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.09, 6), new THREE.MeshStandardMaterial({ color: 0xa3abb2, metalness: 0.7, roughness: 0.35 }));
        tip.rotation.x = Math.PI / 2;
        tip.position.z = 0.44;
        g.add(shaft, tip);
        for (const s of [0, Math.PI / 2]) {
          const fl = new THREE.Mesh(new THREE.PlaneGeometry(0.07, 0.15), new THREE.MeshStandardMaterial({ color: 0xd9cfb8, side: THREE.DoubleSide }));
          fl.position.z = -0.33;
          fl.rotation.set(Math.PI / 2, s, 0);
          g.add(fl);
        }
        g.traverse((m) => (m.castShadow = true));
        g.scale.setScalar(1.8);
        scene.add(g);
        return g;
      }

      // ---------- armies from battle.json ----------
      const laneZ = (c, seed) => (c - (LANES - 1) / 2) * 1.15 + (rand(seed) - 0.5) * 0.18;
      const units = [];
      let uid = 0;
      const sides = CFG.sides.map((s, si) => {
        const dir = si === 0 ? 1 : -1; // side 0 on the left facing right
        const kitOf = (id) => LIB.kits[`${id}@${s.colour}`];
        const heads = s.heads ? LIB.heads[`${s.heads}@${s.colour}`] : null;
        const melee = s.ranks.filter((id) => kitOf(id).role !== "cung-thu");
        const archers = s.ranks.filter((id) => kitOf(id).role === "cung-thu");
        return { ...s, si, dir, kitOf, heads, melee, archers, units: [] };
      });

      function unit(side, kitId, kind, row, c) {
        uid++;
        const kit = side.kitOf(kitId);
        const useFace = side.heads && rand(uid * 13) < 0.55;
        const faces = side.heads ? Object.keys(side.heads.parts) : [];
        const f = makeFigure(kit, useFace ? side.heads : null, useFace ? faces[Math.floor(rand(uid * 17) * faces.length)] : null);
        f.root.scale.x = side.dir;
        equip(f, kit);
        const u = { f, kit, side, kind, row, c, id: uid, ph: rand(uid * 7) * 6, z: laneZ(c, uid * 31) };
        units.push(u);
        side.units.push(u);
        return u;
      }

      for (const side of sides) {
        const d = side.dir,
          base = side.si === 0 ? 8.6 : 9.0;
        side.melee.forEach((kid, r) => {

      const idlePose = (t, ph) => ({ lean: 0.03 + 0.012 * Math.sin(t * 2 + ph), tilt: 0, aL1: 0.3, aL2: 0.3, aR1: 0.05, aR2: 0.25, lL1: 0.12, lL2: 0, lR1: -0.12, lR2: 0, lift: 0, fall: 0 });

        const point = smooth(seg(t, adv + 1.0, adv + 1.6));
        p = mixPose(p, { aR1: 1.75, aR2: 0.1, lean: 0.12 }, point * 0.85);
        const tw = s.rout != null ? Math.min(t, s.rout) : t;
        let x = lerp(u.x0, -s.dir * 4.2, smooth(seg(tw, adv + 0.6, CLASH + 0.8)));
        const walk = gait(Math.abs(x - u.x0), Math.min(1, smooth(seg(tw, adv + 0.6, adv + 1.4)) * (1 - smooth(seg(tw, CLASH + 0.3, CLASH + 0.8))) * 0.55));
        p = Object.assign(p, { lL1: walk.lL1, lL2: walk.lL2, lR1: walk.lR1, lR2: walk.lR2 });
        u.tilt = 1.2 * point;
        let face = s.dir;
        if (s.rout != null && t > s.rout - 0.3) {
          // the commander turns first and leads the flight
          const r = t - (s.rout - 0.3),
            run = Math.max(0, r - 0.3);
          face = s.dir * Math.cos(Math.PI * smooth(seg(r, 0, 0.35)));
          x -= s.dir * 2.3 * run;
          p = Object.assign({}, p, gait(run * 4.4, Math.min(1, run * 2)), { lean: 0.3 * Math.min(1, run * 2), aR1: 0.5, aR2: 0.9 });
          u.tilt = 0;
        }
        return { p, x, face };
      }

      const SEAT = { lean: 0.06, tilt: 0, lL1: 1.3, lL2: -1.2, lR1: 1.4, lR2: -1.25, lift: 0, fall: 0, seat: true };
      function cavalry(u, t) {
        const D = Math.max(1e-6, Math.abs(u.xt - u.x0));
        let [s, v] = u.trip.at(t - u.go);
        const k = s / D;
        let x = lerp(u.x0, u.xt, k);
        const z = lerp(u.z0, u.zt, smooth(seg(k, 0.55, 1)));
        // mounted archers wheel about after their volley: the paper puppet flips, then rides home
        let face = u.side.dir;
        if (u.back && t > u.backAt) {
          const [s2, v2] = u.back.at(t - u.backAt - 0.3);
          x = lerp(u.xt, u.x0, s2 / D);
          s = D + s2;
          v = v2;
          face = u.side.dir * Math.cos(Math.PI * smooth(seg(t, u.backAt, u.backAt + 0.35)));
        }
        const amp = Math.min(1, v / (u.g.M.speed * 0.75));
        const ph = s / u.g.M.stride + u.ph;
        poseMount(u.m, ph, amp, t, u.seed);
        u.m.root.position.set(x, 0, z);
        u.m.root.scale.x = Math.abs(face) < 0.02 ? 0.02 * Math.sign(face || 1) : face;
        // the rider rises and falls with the stride
        let p = Object.assign({}, SEAT, { lift: 0.05 * amp * Math.abs(Math.cos(2 * Math.PI * ph)), lean: SEAT.lean + 0.12 * amp });
        const w = u.kit.weapon;
        if (u.g.shoot) {
          p = Object.assign(p, pick(archerPose(u, t), ["aL1", "aL2", "aR1", "aR2", "tilt"]));
          if (t > u.vol - 0.4) p.lean = lerp(p.lean, -0.05, smooth(seg(t, u.vol - 0.4, u.vol)));
        } else {
          Object.assign(p, guardArms(w));
          if (w === "polearm") Object.assign(p, { aR1: 0.6, aR2: 1.0 });
          // after the impact the riders keep fighting from the saddle
          const fightFrom = u.arrive - 0.2;
          if (t > fightFrom) {
            const kk = ((((t - fightFrom) / 1.15 + rand(u.id * 41)) % 1) + 1) % 1;
            Object.assign(p, strikeArms(w, kk));
          }
        }
        // lances come down for the charge
        u.tilt = w === "polearm" ? 1.45 * smooth(seg(t, u.go + 0.2, u.go + 1.0)) : 0;
        return p;
      }
      const pick = (o, keys) => Object.fromEntries(keys.filter((k) => k in o).map((k) => [k, o[k]]));

      // ---------- arrow volleys ----------
      const GRAV = new THREE.Vector3(0, -9.8, 0);
      const Z = new THREE.Vector3(0, 0, 1);
      const tmp = new THREE.Vector3();
      for (const u of units.filter((u) => u.arrow)) {
        if (u.kind === "cav") {
          poseMount(u.m, 0, 0, u.rel, u.seed);
          u.m.root.position.set(u.xt, 0, u.zt);
          applyPose(u.f, cavalry(u, u.rel - 0.001));
          u.m.root.position.set(u.xt, 0, u.zt);
          u.m.root.updateMatrixWorld(true);
        } else {
          u.f.root.position.set(u.x0, 0, u.z);
          applyPose(u.f, archerPose(u, u.rel - 0.001));
          u.f.root.updateMatrixWorld(true);
        }
        const start = u.f.armL.end.getWorldPosition(new THREE.Vector3());
        const enemy = sides[1 - u.side.si];
        const frontX = enemy.melee.length ? -enemy.dir * (enemy.si === 0 ? 8.6 : 9.0) : 0;
        let target;
        if (u.kind === "cav") {
          // mounted archers aim where the enemy's outer files will be when the arrows come down
          const files = enemy.units.filter((v) => v.kind === "melee" && (u.g.w < 0 ? v.c < 3 : v.c >= LANES - 3));
          const v = files[Math.floor(rand(u.id + 44) * files.length)];
          const land = u.rel + 1.9;
          target = v ? new THREE.Vector3(chargeX(v, land).x + (rand(u.id + 40) - 0.5) * 1.2, 0.12, v.z + (rand(u.id + 41) - 0.5) * 1.2) : new THREE.Vector3(frontX, 0.12, u.z);
        } else target = new THREE.Vector3(frontX + -enemy.dir * (rand(u.id + 40) * 3.4 - 2.6), 0.12, u.z + (rand(u.id + 41) - 0.5) * 2);
        u.F = 1.85 + rand(u.id + 42) * 0.3;
        u.start = start;
        u.target = target;
        u.v = target.clone().sub(start).addScaledVector(GRAV, -0.5 * u.F * u.F).divideScalar(u.F);
      }
      // arrows that land on someone: the nearest enemy footman within 1.3 m of where the arrow comes down falls, with a
      // chance of "volleyLoss" (on the side, or on a mounted-archer group; default 0.25)
      for (const u of units.filter((u) => u.arrow && u.target)) {
        const enemy = sides[1 - u.side.si];
        const land = u.rel + u.F;
        const p = u.g ? u.g.e.volleyLoss ?? u.side.volleyLoss ?? 0.25 : u.side.volleyLoss ?? 0.25;
        if (rand(u.id * 61 + 7) > p) continue;
        let best = null,
          bd = 1.3;
        for (const v of enemy.units) {
          if (v.kind !== "melee" || (v.dieAt && v.dieAt <= land)) continue;
          const d = Math.hypot(chargeX(v, land).x - u.target.x, v.z - u.target.z);
          if (d < bd) (bd = d), (best = v);
        }
        if (best) best.dieAt = land;
      }
      function placeArrow(u, t) {
        const v = u.vol ?? u.side.volley;
        if (t < v + u.o) return void (u.arrow.visible = false);
        u.arrow.visible = true;
        if (t < u.rel) {
          u.f.armR.end.getWorldPosition(tmp);
          const bowHand = u.f.armL.end.getWorldPosition(new THREE.Vector3());
          const dir = bowHand.clone().sub(tmp).normalize();
          if (u.kit.weapon === "crossbow") u.arrow.position.copy(bowHand).addScaledVector(dir, 0.2);
          else u.arrow.position.copy(tmp).addScaledVector(dir, 0.42);
          u.arrow.quaternion.setFromUnitVectors(Z, dir);
          return;
        }
        const tau = Math.min(t - u.rel, u.F);
        const p = u.start.clone().addScaledVector(u.v, tau).addScaledVector(GRAV, 0.5 * tau * tau);
        const dir = u.v.clone().addScaledVector(GRAV, tau).normalize();
        if (t - u.rel >= u.F) p.addScaledVector(dir, 0.22);
        u.arrow.position.copy(p);
        u.arrow.quaternion.setFromUnitVectors(Z, dir);
      }

      // ---------- camera: wide tableau sized to the armies, slow push ----------
      const span = Math.max(14, ...units.map((u) => Math.abs(u.x0)), ...units.filter((u) => u.kind === "cav").map((u) => Math.abs(u.z0) * 1.3)) + 1.5;
      const zoom = span / 15;
      function cameraAt(t) {
        // optional fixed shot from battle.json: "camera": {"pos": [x, y, z], "look": [x, y, z]}
        if (CFG.camera && CFG.camera.pos) {
          camera.position.fromArray(CFG.camera.pos);
          camera.lookAt(new THREE.Vector3().fromArray(CFG.camera.look || [0, 1, 0]));
          return;
        }
        const u = smooth(t / DUR);
        const target = new THREE.Vector3(lerp(-0.6, 0.4, u), 0.3, lerp(-1.2, -0.6, u));
        const off = new THREE.Vector3(lerp(-0.6, 0.2, u), lerp(20.7, 18.2, u), lerp(25.7, 22.1, u)).multiplyScalar(zoom);
        camera.position.copy(target).add(off);
        camera.lookAt(target);
      }

      // ---------- map annotations: side labels, advance arrows, volley arcs, title ----------
      const ANN = Object.assign({ labels: true, arrows: true, volleys: true, title: true }, CFG.annotations || {});
      const HEX = { red: "#c0392b", blue: "#2f62b3", green: "#2e8b4a", yellow: "#d9a520", orange: "#e0761c", purple: "#7d4aa6", white: "#eeeae0", black: "#2a2723", teal: "#2a8c8c" };
      const svg = document.getElementById("annot");
      const NS = "http://www.w3.org/2000/svg";
      const el = (tag, attrs) => {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        svg.appendChild(e);
        return e;
      };
      const toScreen = (x, y, z) => {
        const v = new THREE.Vector3(x, y, z).project(camera);
        return [((v.x + 1) / 2) * W, ((1 - v.y) / 2) * H];
      };
      const titleEl = document.getElementById("title");
      if (ANN.title && CFG.title) titleEl.textContent = CFG.title;
      for (const side of sides) {
        const col = HEX[side.colour] || "#888";
        if (ANN.labels && side.name) {
          const d = document.createElement("div");
          d.className = "side-label";
          d.style.setProperty("--c", col);
          d.textContent = side.name;
          if (side.note) {
            const sm = document.createElement("small");
            sm.textContent = side.note;
            d.appendChild(sm);
          }
          document.getElementById("labels").appendChild(d);
          side.labelEl = d;
        }
        if (ANN.arrows && side.melee.length) {
          // under-stroke for contrast, faction-coloured body, arrow head
          side.arrowUnder = el("path", { fill: "none", stroke: "rgba(20,14,8,0.75)", "stroke-width": 44, "stroke-linecap": "round" });
          side.arrowBody = el("path", { fill: "none", stroke: col, "stroke-width": 30, "stroke-linecap": "round", opacity: 0.92 });
          side.arrowHead = el("polygon", { fill: col, stroke: "rgba(20,14,8,0.75)", "stroke-width": 6, "stroke-linejoin": "round" });
        }
        if (ANN.arrows)
          for (const g of side.groups) {
            g.arrowUnder = el("path", { fill: "none", stroke: "rgba(20,14,8,0.75)", "stroke-width": 34, "stroke-linecap": "round" });
            g.arrowBody = el("path", { fill: "none", stroke: col, "stroke-width": 22, "stroke-linecap": "round", opacity: 0.92 });
            g.arrowHead = el("polygon", { fill: col, stroke: "rgba(20,14,8,0.75)", "stroke-width": 6, "stroke-linejoin": "round" });
          }
        if (ANN.volleys && side.volley != null && side.archers.length) {
          side.volleyArc = el("path", { fill: "none", stroke: "#f6efe0", "stroke-width": 5, "stroke-dasharray": "14 12", "stroke-linecap": "round" });
          side.volleyHead = el("polygon", { fill: "#f6efe0" });
        }
      }
      const pathD = (pts) => pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
      function headAt(pts, size) {
        const [a, b] = [pts[pts.length - 2], pts[pts.length - 1]];
        const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
        const tip = [b[0] + Math.cos(ang) * size * 0.9, b[1] + Math.sin(ang) * size * 0.9];
        const l = [b[0] + Math.cos(ang + 2.2) * size * 0.75, b[1] + Math.sin(ang + 2.2) * size * 0.75];
        const r = [b[0] + Math.cos(ang - 2.2) * size * 0.75, b[1] + Math.sin(ang - 2.2) * size * 0.75];
        return [tip, l, r].map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" ");
      }
      // keep only the drawn fraction of a polyline
      function partial(pts, f) {
        if (f >= 1) return pts;
        const lens = [0];
        for (let i = 1; i < pts.length; i++) lens.push(lens[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
        const want = lens[lens.length - 1] * f,
          out = [pts[0]];
        for (let i = 1; i < pts.length; i++) {
          if (lens[i] < want) out.push(pts[i]);
          else {
            const u = (want - lens[i - 1]) / Math.max(1e-6, lens[i] - lens[i - 1]);
            out.push([lerp(pts[i - 1][0], pts[i][0], u), lerp(pts[i - 1][1], pts[i][1], u)]);
            break;
          }
        }
        if (out.length < 2) out.push(pts[0]);
        return out;
      }

      function placeLabels(t) {
        const [L, R] = sides;
        if (!L.labelEl || !R.labelEl) return;
        // push the two labels apart when the armies close in
        const gap = 28,
          need = (L.labelEl.offsetWidth + R.labelEl.offsetWidth) / 2 + gap;
        const short = need - (R.labelPos[0] - L.labelPos[0]);
        if (short > 0) {
          L.labelPos[0] -= short / 2;
          R.labelPos[0] += short / 2;
        }
        const a = smooth(seg(t, 0.3, 0.9));
        for (const side of sides) {
          side.labelEl.style.opacity = a;
          side.labelEl.style.transform = `translate(${side.labelPos[0]}px, ${side.labelPos[1]}px) translate(-50%, -100%) translateY(${(1 - a) * 14}px)`;
        }
      }

      function annotate(t) {
        titleEl.style.opacity = ANN.title && CFG.title ? smooth(seg(t, 0.2, 0.8)) : 0;
        for (const side of sides) {
          const d = side.dir,
            adv = side.advance ?? 3;
          if (side.labelEl) {
            // label rides above the army, kept behind its front rank so the two never collide
            const mel = side.units.filter((u) => u.kind === "melee");
            const xs = mel.length ? mel.map((u) => u.f.root.position.x) : side.units.map((u) => u.x0);
            const back = d > 0 ? Math.min(...xs) : Math.max(...xs);
            const front = d > 0 ? Math.max(...xs) : Math.min(...xs);
            const lx = lerp(back, front, 0.35);
            const [sx, sy] = toScreen(lx, 3.4, -(LANES / 2) * 1.15 - 0.6);
            side.labelPos = [sx, sy];
          }
          if (side.arrowBody) {
            const x0 = side.units.find((u) => u.kind === "melee").x0 + d * 0.6;
            const x1 = -d * 1.6;
            const pts = [];
            for (let i = 0; i <= 24; i++) {
              const u = i / 24;
              pts.push(toScreen(lerp(x0, x1, u), 0.05, 1.2 * Math.sin(u * Math.PI) * d));
            }
            const grow = easeOut(seg(t, adv - 0.9, adv - 0.1));
            const fade = 1 - smooth(seg(t, CLASH - 0.4, CLASH + 0.2));
            const vis = grow > 0.01 ? fade : 0;
            const shown = partial(pts, grow);
            const dstr = pathD(shown);
            side.arrowUnder.setAttribute("d", dstr);
            side.arrowBody.setAttribute("d", dstr);
            side.arrowHead.setAttribute("points", headAt(shown, 46));
            for (const e of [side.arrowUnder, side.arrowBody, side.arrowHead]) e.style.opacity = vis;
          }
          for (const g of side.groups) {
            if (!g.arrowBody) continue;
            const avg = (key) => g.units.reduce((a, u) => a + u[key], 0) / g.units.length;
            const [x0, z0, x1, z1] = [avg("x0") + d * 1.2, avg("z0"), avg("xt"), avg("zt")];
            const pts = [];
            for (let i = 0; i <= 24; i++) {
              const u = i / 24;
              pts.push(toScreen(lerp(x0, x1, u), 0.05, lerp(z0, z1, smooth(u)) + 0.8 * g.w * Math.sin(u * Math.PI)));
            }
            const end = Math.min(...g.units.map((u) => u.arrive));
            const grow = easeOut(seg(t, g.charge - 0.9, g.charge - 0.1));
            const vis = grow > 0.01 ? 1 - smooth(seg(t, end - 0.6, end)) : 0;
            const shown = partial(pts, grow),
              dstr = pathD(shown);
            g.arrowUnder.setAttribute("d", dstr);
            g.arrowBody.setAttribute("d", dstr);
            g.arrowHead.setAttribute("points", headAt(shown, 36));
            for (const e of [g.arrowUnder, g.arrowBody, g.arrowHead]) e.style.opacity = vis;
          }
          if (side.volleyArc) {
            const arch = side.units.filter((u) => u.kind === "archer");
            const ax = arch.reduce((s, u) => s + u.x0, 0) / arch.length;
            const enemy = sides[1 - side.si];
            const tx = enemy.units.length ? enemy.units.filter((u) => u.kind === "melee").reduce((s, u) => s + u.x0, 0) / Math.max(1, enemy.melee.length * LANES) : 0;
            const pts = [];
            for (let i = 0; i <= 24; i++) {
              const u = i / 24;
              pts.push(toScreen(lerp(ax, tx, u), 1.5 + 9 * Math.sin(u * Math.PI), 0));
            }
            const v = side.volley;
            const grow = easeOut(seg(t, v + 0.4, v + 1.6));
            const vis = grow > 0.01 ? 1 - smooth(seg(t, v + 2.6, v + 3.2)) : 0;
            const shown = partial(pts, grow);
            side.volleyArc.setAttribute("d", pathD(shown));
            side.volleyHead.setAttribute("points", headAt(shown, 20));
            side.volleyArc.style.opacity = side.volleyHead.style.opacity = vis * 0.9;
          }
        }
        placeLabels(t);
      }

      // ---------- frame ----------
      function renderAt(t) {
        for (const u of units) {
          let p,
            x = u.x0;
          if (u.kind === "cav") {
            p = cavalry(u, t);
            applyPose(u.f, p);
            if (u.f.pole) u.f.pole.rotation.z = -(p.aR1 + p.aR2) - (u.tilt || 0);
            if (u.f.shield) u.f.shield.rotation.z = -(p.aL1 + p.aL2);
            continue;
          }
          if (u.kind === "archer") p = archerPose(u, t);
          else if (u.kind === "commander") ({ p, x, face: u.face } = commanderPose(u, t));
          else ({ p, x, face: u.face } = infantry(u, t));
          u.f.root.position.set(x, 0, u.z);
          if (u.face != null) u.f.root.scale.x = Math.abs(u.face) < 0.02 ? 0.02 * Math.sign(u.face || 1) : u.face;
          applyPose(u.f, p);
          if (u.f.pole) u.f.pole.rotation.z = -(p.aR1 + p.aR2) - (u.tilt || 0);
          if (u.f.shield) u.f.shield.rotation.z = -(p.aL1 + p.aL2);
        }
        scene.updateMatrixWorld(true);
        for (const u of units) if (u.arrow) placeArrow(u, t);
        placePuffs(t);
        cameraAt(t);
        camera.updateMatrixWorld();
        annotate(t);
        renderer.setRenderTarget(null);
        renderer.clear(true, true, true);
        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
